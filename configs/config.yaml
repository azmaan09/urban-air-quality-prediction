# =============================================================================
# Early Prediction of Urban Air-Quality Episodes — Project Configuration
# =============================================================================
# All experiment settings live here so runs are reproducible and auditable.
# Do not hard-code thresholds or split ratios in notebooks.

project:
  name: "Early Prediction of Urban Air-Quality Episodes"
  short_name: "urban-aq-episode"
  random_seed: 42

# -----------------------------------------------------------------------------
# Dataset
# -----------------------------------------------------------------------------
# Primary source: Beijing Multi-Site Air-Quality Data (UCI ML Repository #501)
# Zhang et al. (2017). Hourly pollutant + meteorological observations, 2013–2017.
dataset:
  name: "Beijing Multi-Site Air-Quality Data"
  source: "UCI Machine Learning Repository"
  uci_id: 501
  url: "https://archive.ics.uci.edu/dataset/501/beijing+multi+site+air+quality+data"
  download_url: "https://archive.ics.uci.edu/ml/machine-learning-databases/00501/PRSA2017_Data_20130301-20170228.zip"
  # Alternate hosts if the primary URL is blocked
  mirror_urls:
    - "https://archive.ics.uci.edu/static/public/501/beijing+multi+site+air+quality+data.zip"
    - "https://archive.ics.uci.edu/ml/machine-learning-databases/00501/PRSA2017_Data_20130301-20170228.zip"
  citation: >
    Zhang, S., Guo, B., Dong, A., He, J., Xu, B., & Chen, S. X. (2017).
    Cautionary Tales on Air-Quality Improvement in Beijing.
    Proceedings of the Royal Society A, 473(2205).
  license: "CC BY 4.0 (UCI redistribution)"
  timezone: "Asia/Shanghai"
  frequency: "1H"
  # Site used for single-station experiments (change to aggregate later if desired)
  primary_site: "Aotizhongxin"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  external_dir: "data/external"

  # Columns present in the raw CSVs (after download)
  columns:
    pollutants: ["PM2.5", "PM10", "SO2", "NO2", "CO", "O3"]
    meteorology: ["TEMP", "PRES", "DEWP", "RAIN", "wd", "WSPM"]
    time_parts: ["year", "month", "day", "hour"]
    identifiers: ["No", "station"]

  # Variables requested in the problem statement but NOT native in this dataset
  missing_native_variables:
    humidity: >
      Relative humidity (%) is not provided. We derive approximate RH from
      TEMP (°C) and DEWP (°C) via the Magnus formula (see preprocessing.py).
    # precipitation IS available as RAIN (mm)
    # pressure IS available as PRES (hPa)

# -----------------------------------------------------------------------------
# Target definition
# -----------------------------------------------------------------------------
# y_t = 1 if max(PM2.5_{t+1}, ..., PM2.5_{t+horizon}) >= threshold
target:
  pollutant: "PM2.5"
  # 150 µg/m³ ≈ China Grade II “heavily polluted” hourly-relevant elevated episode.
  # At 75 µg/m³, next-24h events are extremely common in this Beijing series (~73%),
  # which weakens the early-warning framing. Sensitivity thresholds retained below.
  threshold_ug_m3: 150.0
  horizon_hours: 24
  # Alternative thresholds for sensitivity analysis (not used as primary)
  sensitivity_thresholds: [75.0, 100.0, 115.0, 150.0, 200.0]

# -----------------------------------------------------------------------------
# Feature engineering
# -----------------------------------------------------------------------------
features:
  pm25_lags: [1, 3, 6, 12, 24, 48, 72]
  rolling_windows:
    mean: [6, 12, 24]
    std: [24]
    min: [24]
    max: [24]
  pollutant_lags: [1, 3, 6, 12, 24]
  pollutant_rolling_mean: [24]
  weather_lags: [1, 3, 6, 24]
  include_calendar: true
  include_missingness_indicators: true
  wind_direction_encoding: "cyclic"  # sin/cos of degrees

# -----------------------------------------------------------------------------
# Temporal validation (NO random splits)
# -----------------------------------------------------------------------------
splits:
  method: "chronological"
  # Fractions of the chronologically ordered timeline
  train_ratio: 0.70
  valid_ratio: 0.15
  test_ratio: 0.15
  # Rolling-origin (expanding window) CV on the train+valid period
  rolling_origin:
    enabled: true
    n_splits: 5
    min_train_hours: 8760   # ~1 year minimum training history
    valid_hours: 2160       # ~3 months validation fold

# -----------------------------------------------------------------------------
# Preprocessing
# -----------------------------------------------------------------------------
preprocessing:
  drop_duplicates: true
  sort_chronologically: true
  interpolate_limit_hours: 3   # linear interp only for short gaps
  remaining_missing: "forward_fill_then_indicator"
  outlier_method: "iqr"
  outlier_iqr_multiplier: 5.0  # conservative; air pollution has heavy tails
  clip_outliers: false         # flag, do not destroy extremes by default

# -----------------------------------------------------------------------------
# Models
# -----------------------------------------------------------------------------
models:
  baselines:
    - persistence
    - logistic_regression
    - decision_tree
  advanced:
    - xgboost
    - lightgbm
  xgboost:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 5
    reg_lambda: 1.0
    eval_metric: "aucpr"
  lightgbm:
    n_estimators: 300
    max_depth: -1
    num_leaves: 63
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_samples: 20
    reg_lambda: 1.0
    objective: "binary"
  tuning:
    enabled: true
    n_iter: 20
    scoring: "average_precision"  # PR-AUC — better for imbalanced episodes
    # Never tune on the final hold-out test set

# -----------------------------------------------------------------------------
# Calibration
# -----------------------------------------------------------------------------
calibration:
  methods: ["none", "platt", "isotonic"]
  # Fit calibrators on validation predictions only

# -----------------------------------------------------------------------------
# Evaluation
# -----------------------------------------------------------------------------
evaluation:
  primary_metric: "average_precision"  # PR-AUC
  metrics:
    - average_precision
    - roc_auc
    - f1
    - precision
    - recall
    - brier_score
  decision_threshold: 0.5
  # For early-warning ops, you may prefer a lower threshold to raise recall
  operating_thresholds: [0.3, 0.4, 0.5, 0.6]

# -----------------------------------------------------------------------------
# Paths
# -----------------------------------------------------------------------------
paths:
  figures: "reports/figures"
  tables: "reports/tables"
  report: "reports/technical_report.md"
  artifacts: "models/artifacts"
